<!doctype html>
<html lang="en">

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #010A13; }

    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
